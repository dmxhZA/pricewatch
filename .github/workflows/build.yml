# Checks every pull request and every push to main: runs the tests and builds the release APK.
# The build only shows that the app still builds. The APK comes out unsigned, because the signing
# key never leaves your machine, and the run doesn't keep it. Release APKs are built locally.
name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Test
        run: ./gradlew testDebugUnitTest

      - name: Build the release APK
        run: ./gradlew assembleRelease

      - name: Keep the test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: app/build/reports/tests/
